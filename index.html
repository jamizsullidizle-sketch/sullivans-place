<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sullivan">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Sullivan's Place</title>
</head>
<body>
<div id="app">
  <!-- The house / workshop scene -->
  <header class="scene" aria-hidden="true">
    <svg viewBox="0 0 390 250" preserveAspectRatio="xMidYMax slice" class="shop">
      <defs>
        <radialGradient id="lamp" cx="50%" cy="0%" r="80%">
          <stop offset="0" stop-color="#ffcf7a" stop-opacity=".55"/>
          <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a2a22"/><stop offset="1" stop-color="#2a1f1a"/>
        </linearGradient>
        <pattern id="planks" width="60" height="250" patternUnits="userSpaceOnUse">
          <rect width="60" height="250" fill="url(#wall)"/><line x1="59" y1="0" x2="59" y2="250" stroke="#1f1612" stroke-width="2"/>
        </pattern>
        <radialGradient id="arc"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#9fdcff"/><stop offset="1" stop-color="#9fdcff" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="390" height="250" fill="url(#planks)"/>
      <!-- window with bay view -->
      <g transform="translate(24,40)">
        <rect width="96" height="74" rx="4" fill="#1b2f45"/>
        <rect y="46" width="96" height="28" fill="#21486a"/>
        <circle cx="72" cy="22" r="8" fill="#f6e6b8" opacity=".85"/>
        <path d="M10 52 l10 -8 l10 8 z" fill="#e8e1d4" opacity=".7"/>
        <rect width="96" height="74" rx="4" fill="none" stroke="#6b4a33" stroke-width="6"/>
        <line x1="48" y1="0" x2="48" y2="74" stroke="#6b4a33" stroke-width="4"/>
        <line x1="0" y1="37" x2="96" y2="37" stroke="#6b4a33" stroke-width="4"/>
      </g>
      <!-- sign -->
      <g transform="translate(140,22)">
        <rect width="110" height="34" rx="5" fill="#5a3b26" stroke="#8a5e3b" stroke-width="2"/>
        <text x="55" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#ffd89a">SULLIVAN'S</text>
      </g>
      <!-- pegboard with tools -->
      <g transform="translate(262,34)">
        <rect width="108" height="90" rx="3" fill="#7a5a3c"/>
        <g fill="#5f4530">
          <circle cx="12" cy="12" r="2"/><circle cx="36" cy="12" r="2"/><circle cx="60" cy="12" r="2"/><circle cx="84" cy="12" r="2"/>
          <circle cx="12" cy="40" r="2"/><circle cx="36" cy="40" r="2"/><circle cx="60" cy="40" r="2"/><circle cx="84" cy="40" r="2"/>
        </g>
        <!-- welding helmet -->
        <path d="M14 30 q18 -22 36 0 v26 q-18 10 -36 0z" fill="#2f3237"/>
        <rect x="22" y="38" width="20" height="9" rx="2" fill="#2d6a4f"/>
        <!-- hammer -->
        <rect x="64" y="16" width="5" height="44" fill="#a0703f"/><rect x="56" y="12" width="22" height="9" rx="2" fill="#8d9297"/>
        <!-- angle grinder disk -->
        <circle cx="90" cy="66" r="11" fill="#8d9297"/><circle cx="90" cy="66" r="3" fill="#444"/>
        <!-- clamp -->
        <path d="M18 66 h22 v6 h-16 v10 h-6z" fill="#c0392b"/>
      </g>
      <!-- lamp -->
      <line x1="195" y1="0" x2="195" y2="70" stroke="#222" stroke-width="2"/>
      <path d="M178 70 h34 l-6 -12 h-22z" fill="#2b2b2b"/>
      <ellipse cx="195" cy="72" rx="10" ry="4" fill="#ffe2a0" class="bulb"/>
      <polygon points="150,72 240,72 330,250 60,250" fill="url(#lamp)" class="lightcone"/>
      <!-- workbench -->
      <rect x="0" y="200" width="390" height="50" fill="#4a3324"/>
      <rect x="0" y="196" width="390" height="10" fill="#6b4a33"/>
      <!-- steel being welded -->
      <rect x="150" y="182" width="100" height="14" fill="#7d838a"/>
      <rect x="196" y="168" width="14" height="28" fill="#8d9399"/>
      <!-- spark -->
      <g class="spark" transform="translate(203,182)">
        <circle r="18" fill="url(#arc)"/>
        <g stroke="#fff6c8" stroke-width="1.6" stroke-linecap="round" class="flecks">
          <line x1="0" y1="0" x2="-22" y2="-14"/><line x1="0" y1="0" x2="20" y2="-18"/>
          <line x1="0" y1="0" x2="-14" y2="-24"/><line x1="0" y1="0" x2="26" y2="-6"/>
        </g>
      </g>
      <!-- coffee mug -->
      <g transform="translate(320,176)"><rect width="18" height="20" rx="3" fill="#c9c2b6"/><path d="M18 5 q8 0 8 6 q0 6 -8 6" fill="none" stroke="#c9c2b6" stroke-width="3"/><text x="9" y="14" font-size="6" text-anchor="middle" fill="#6b4a33">RI</text></g>
      <!-- Jimmy avatar -->
      <g transform="translate(60,128)"><g class="jimmy">
        <rect x="6" y="40" width="48" height="34" rx="12" fill="#2f4a63"/>
        <circle cx="30" cy="26" r="18" fill="#e9b996"/>
        <path d="M12 22 q18 -22 36 0 v-6 q-18 -14 -36 0z" fill="#3b2a20"/>
        <rect x="10" y="12" width="40" height="8" rx="3" fill="#1f2a36"/>
        <circle cx="23" cy="27" r="2" fill="#2a1f1a"/><circle cx="37" cy="27" r="2" fill="#2a1f1a"/>
        <path d="M23 35 q7 5 14 0" stroke="#7a4a30" stroke-width="2" fill="none"/>
        <path d="M18 34 q12 14 24 0 v4 q-12 10 -24 0z" fill="#5b3f2c" opacity=".55"/>
      </g></g>
    </svg>
    <div class="titlebar">
      <div>
        <h1>Sullivan's Place</h1>
        <p id="statusLine"><span class="dot"></span><span id="statusText">AI Jimmy's in the shop</span></p>
      </div>
      <button id="settingsBtn" class="iconbtn" aria-label="About me settings">⚙︎</button>
    </div>
  </header>

  <div id="modeBanner" class="banner hidden"></div>

  <main id="chat" aria-live="polite"></main>

  <form id="composer" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Say something to Jimmy…" aria-label="Message"></textarea>
    <button type="submit" id="sendBtn" aria-label="Send">➤</button>
  </form>
</div>

<!-- Settings / About me panel -->
<div id="panel" class="panel hidden" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="panelTitle">About me <small>(Jimmy's notes for AI Jimmy)</small></h2>
      <button class="iconbtn" id="closePanel" aria-label="Close">✕</button>
    </div>
    <p class="hint">Everything here stays on this phone. AI Jimmy reads it before he answers.</p>
    <label>Who I am
      <textarea id="p_about" rows="4"></textarea></label>
    <label>How I talk
      <textarea id="p_voice" rows="3"></textarea></label>
    <label>What I'm up to / when I'm around
      <textarea id="p_availability" rows="3"></textarea></label>
    <label>Stuff I like to talk about
      <textarea id="p_interests" rows="2"></textarea></label>
    <label>Never say / off-limits
      <textarea id="p_never" rows="3"></textarea></label>
    <label>"Busy" message (status line)
      <input id="p_status" type="text"></label>
    <fieldset>
      <legend>AI brain</legend>
      <label class="row"><input type="checkbox" id="p_demo"> Force offline demo mode</label>
      <label>Chat endpoint <input id="p_endpoint" type="text" placeholder="/api/chat"></label>
    </fieldset>
    <div class="actions">
      <button id="resetPersona" class="ghost" type="button">Reset to defaults</button>
      <button id="clearChat" class="ghost" type="button">Clear chat</button>
      <button id="lockBtn" class="ghost" type="button">🔒 Lock</button>
      <button id="savePersona" class="primary" type="button">Save</button>
    </div>
  </div>
</div>

<!-- Passcode gate: the front door -->
<div id="gate" class="gate hidden" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <svg viewBox="0 0 200 230" class="door" aria-hidden="true">
    <defs><radialGradient id="porch" cx="50%" cy="20%" r="70%"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".5"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient></defs>
    <rect width="200" height="230" fill="url(#porch)"/>
    <polygon points="20,80 100,18 180,80" fill="#46484e" stroke="#2b2c30" stroke-width="5"/>
    <rect x="34" y="78" width="132" height="152" fill="#7a3a26"/>
    <rect x="70" y="112" width="60" height="118" rx="4" fill="#4a2a1a" stroke="#2a170e" stroke-width="3"/>
    <rect x="80" y="124" width="40" height="30" rx="3" fill="#ffc777" opacity=".85" class="doorwin"/>
    <circle cx="120" cy="178" r="4" fill="#d9b25f"/>
    <rect x="76" y="88" width="48" height="16" rx="3" fill="#5a3b26"/>
    <text x="100" y="100" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#ffd89a">SULLIVAN</text>
    <circle cx="100" cy="60" r="5" fill="#fff6c8" class="porchlight"/>
  </svg>
  <h2 id="gateTitle">Knock knock.</h2>
  <p>This is Jimmy's place. Passcode to come in.</p>
  <form id="gateForm" autocomplete="off">
    <input id="gateInput" type="password" placeholder="Passcode" aria-label="Passcode" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button type="submit" id="gateBtn">Come in</button>
  </form>
  <p id="gateMsg" class="gatemsg" aria-live="polite"></p>
</div>

<div id="installTip" class="install hidden"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
